<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦄 Tienda Otaku Exótico</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Barra de navegación superior -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="brand-icon">🦄</span>
                <span class="brand-text">Tienda Otaku Exótico</span>
            </div>
            
            <div class="nav-menu" id="navMenu">
                <a href="#" class="nav-link active" data-page="home">
                    <i class="fas fa-home"></i> Inicio
                </a>
                <a href="#" class="nav-link" data-page="orders">
                    <i class="fas fa-box"></i> Mis Pedidos
                </a>
                <a href="#" class="nav-link" data-page="profile">
                    <i class="fas fa-user"></i> Perfil
                </a>
            </div>

            <div class="nav-actions">
                <button class="nav-cart" onclick="openCart()">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" id="navCartBadge">0</span>
                </button>
                <div class="nav-user" id="navUser">
                    <span id="navUsername">Invitado</span>
                    <button id="navAuthBtn" onclick="toggleAuth()" class="btn-auth">
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="main-content">
        <!-- Página de inicio -->
        <section id="page-home" class="page-section active">
            <!-- Categorías -->
            <div class="categories-wrapper">
                <div class="categories-scroll">
                    <button class="category-btn active" data-category="all">
                        <i class="fas fa-th-large"></i> Todos
                    </button>
                    <button class="category-btn" data-category="figuras">
                        <i class="fas fa-user-astronaut"></i> Figuras
                    </button>
                    <button class="category-btn" data-category="mangas">
                        <i class="fas fa-book"></i> Mangas
                    </button>
                    <button class="category-btn" data-category="accesorios">
                        <i class="fas fa-gem"></i> Accesorios
                    </button>
                    <button class="category-btn" data-category="ediciones">
                        <i class="fas fa-crown"></i> Ediciones Especiales
                    </button>
                </div>
            </div>

            <!-- Grid de productos -->
            <div class="products-header">
                <h2><i class="fas fa-store"></i> Productos Destacados</h2>
                <span class="products-count" id="productsCount">0 productos</span>
            </div>
            <div class="product-grid" id="productGrid">
                <!-- Productos cargados dinámicamente -->
            </div>
        </section>

        <!-- Página de pedidos -->
        <section id="page-orders" class="page-section">
            <div class="section-header">
                <h2><i class="fas fa-box"></i> Mis Pedidos</h2>
            </div>
            <div id="ordersList" class="orders-list">
                <!-- Pedidos cargados dinámicamente -->
            </div>
        </section>

        <!-- Página de perfil -->
        <section id="page-profile" class="page-section">
            <div class="section-header">
                <h2><i class="fas fa-user-circle"></i> Mi Perfil</h2>
            </div>
            <div id="profileContent" class="profile-content">
                <!-- Perfil cargado dinámicamente -->
            </div>
        </section>
    </main>

    <!-- Modal de autenticación -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-box auth-modal">
            <div class="modal-header">
                <h2 id="authModalTitle">Iniciar Sesión</h2>
                <button class="modal-close" onclick="closeAuth()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="authForm" onsubmit="handleAuth(event)">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Usuario</label>
                        <input type="text" id="username" placeholder="Nombre de usuario" required>
                    </div>
                    <div class="form-group" id="emailGroup">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary btn-block" id="authSubmitBtn">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </button>
                    <button type="button" class="btn-text" onclick="toggleAuthMode()" id="toggleAuthBtn">
                        ¿No tienes cuenta? Regístrate
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal de carrito -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-box cart-modal">
            <div class="modal-header">
                <h2><i class="fas fa-shopping-cart"></i> Carrito de Compras</h2>
                <button class="modal-close" onclick="closeCart()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="cartItems" class="cart-items">
                    <!-- Items del carrito -->
                </div>
                <div class="cart-footer">
                    <div class="cart-total">
                        <span>Total:</span>
                        <span class="total-amount">$<span id="cartTotal">0.00</span></span>
                    </div>
                    <button class="btn-primary btn-block" onclick="proceedToCheckout()">
                        <i class="fas fa-credit-card"></i> Finalizar Compra
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de checkout -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-box checkout-modal">
            <div class="modal-header">
                <h2><i class="fas fa-credit-card"></i> Finalizar Compra</h2>
                <button class="modal-close" onclick="closeCheckout()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="checkoutForm" onsubmit="processCheckout(event)">
                    <div class="form-group">
                        <label><i class="fas fa-map-marker-alt"></i> Dirección de Envío</label>
                        <textarea id="shippingAddress" placeholder="Calle, número, colonia, ciudad, CP" required></textarea>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-credit-card"></i> Método de Pago</label>
                        <select id="paymentMethod" required>
                            <option value="credit_card">💳 Tarjeta de Crédito</option>
                            <option value="paypal">💰 PayPal</option>
                            <option value="oxxo">🏪 OXXO</option>
                            <option value="cash">💵 Efectivo (Recoger en tienda)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary btn-block">
                        <i class="fas fa-check-circle"></i> Confirmar Compra
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Notificación toast -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
